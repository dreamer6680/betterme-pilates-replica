services:
  postgres:
    image: postgres:16-alpine
    container_name: betterme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: betterme
    ports:
      - "5432:5432"
    volumes:
      - betterme_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d betterme"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  betterme_postgres_data:
